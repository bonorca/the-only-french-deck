<!-- play buttons for the forms -->
<script>
(function () {
  var svg = '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29"></circle><path d="M56.502,32.301l-37.502,20.101l0.329,-40.804l37.173,20.703Z"></path></svg>';
  var list = document.querySelectorAll("audio.say");
  for (var i = 0; i < list.length; i++) (function (a) {
    if (a.nextSibling && a.nextSibling.className === "say") return;
    var b = document.createElement("a");
    b.className = "say"; b.href = "#"; b.innerHTML = svg;
    b.onclick = function (e) { e.preventDefault(); try { a.currentTime = 0; } catch (x) {} a.play(); };
    a.parentNode.insertBefore(b, a.nextSibling);
  })(list[i]);
})();
</script>
<!-- feedback link -->
<div id="fb"><a id="fb-link" href="https://github.com/chillibeaver/the-only-french-deck/issues/new">反馈这张卡</a></div>
<span id="fb-word" hidden>{{text:Word}}</span>
<script>
(function () {
  var a = document.getElementById("fb-link"), w = document.getElementById("fb-word");
  if (!a || !w) return;
  var word = w.textContent.trim(), version = "v1.0";
  var title = "[卡片反馈]:" + word;
  var body = "### 卡片信息\n- 卡组版本: " + version + "\n- 单词: " + word +
             "\n\n### 问题\n（发音 / 释义 / 例句 / 阴阳性数 / 其他，请写具体一些）\n";
  a.href = "https://github.com/chillibeaver/the-only-french-deck/issues/new?title=" + encodeURIComponent(title) + "&body=" + encodeURIComponent(body);
})();
</script>
